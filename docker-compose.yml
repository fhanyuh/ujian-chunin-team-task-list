services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: team-task-backend:latest
    container_name: team-task-backend
    ports:
      - "5000:5000"
    environment:
      - DATA_FILE=/var/lib/backend_data/tasks.json
      - PYTHONUNBUFFERED=1
    volumes:
      - team-task-data:/var/lib/backend_data
    networks:
      - app-net
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    container_name: team-task-frontend
    ports:
      - "3000:80"
    volumes:
      - ${FRONTEND_HTML_PATH:-/home/hanmazaya/Documents/tugas-kuliah/cc/ujian-chunin/index.html}:/usr/share/nginx/html/index.html:ro
    command:
      - /bin/sh
      - -c
      - |
        cat <<'EOF' > /etc/nginx/conf.d/default.conf
        server {
            listen 80;
            server_name localhost;
            resolver 127.0.0.11 valid=5s ipv6=off;

            location / {
                root /usr/share/nginx/html;
                index index.html;
                etag off;
                add_header Cache-Control "no-store, no-cache, must-revalidate";
            }

            location /tasks {
                set $$backend_upstream http://backend:5000;
                proxy_pass $$backend_upstream;
                proxy_http_version 1.1;
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
            }

            location /messages {
                set $$backend_upstream http://backend:5000;
                proxy_pass $$backend_upstream;
                proxy_http_version 1.1;
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
            }

            location /health {
                set $$backend_upstream http://backend:5000;
                proxy_pass $$backend_upstream;
                proxy_http_version 1.1;
                proxy_set_header Host $$host;
            }
        }
        EOF
        exec nginx -g 'daemon off;'
    depends_on:
      - backend
    networks:
      - app-net
    restart: unless-stopped

volumes:
  team-task-data:
    name: team-task-data

networks:
  app-net:
    name: app-net
    driver: bridge
